<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10473d"><title>FUTURE PHARMA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="overrides.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head>
<body><section id="login" class="login-wrap"><form id="loginForm" class="login-card"><div class="brandmark">✚</div><h1>FUTURE PHARMA</h1><p>Apne account mein sign in karein</p><label>Username<input name="username" autocomplete="username" required placeholder="username"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label><button class="btn primary wide">Login</button><div id="loginError" class="error"></div><small>Database connection ke liye config.js set karein.</small></form></section>
<div id="application" class="app hidden"><aside class="sidebar"><div class="brand"><span class="brandmark mini">✚</span><b>FUTURE PHARMA</b></div><nav id="navigation"><button data-page="dashboard" class="nav active">▦ <span>Dashboard</span></button><button data-page="customers" class="nav">♙ <span>Customers</span></button><button data-page="products" class="nav">▧ <span>Products</span></button><button data-page="orders" class="nav">▤ <span>Orders</span></button><button data-page="recovery" class="nav">↗ <span>Recovery</span></button><button data-page="ledger" class="nav">▥ <span>Ledger</span></button><button data-page="admin" class="nav admin-only hidden">⚙ <span>Admin panel</span></button></nav><div class="sidebottom"><span id="roleLabel"></span><button id="logout" class="nav">⇥ <span>Logout</span></button></div></aside>
<main><header class="topbar"><button id="menuToggle" class="iconbtn">☰</button><div id="greeting">Assalamualaikum</div><div class="top-right"><span id="connectionStatus" class="connection online">ONLINE</span><time id="clock"></time><span id="userName" class="userchip"></span></div></header><section id="view" class="view"></section></main></div>
<dialog id="dialog"><form id="dialogForm" method="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="iconbtn" type="button" onclick="document.getElementById('dialog').close()">&times;</button></div><div id="dialogContent"></div><div class="dialog-actions"><button class="btn" type="button" onclick="document.getElementById('dialog').close()">Cancel</button><button id="dialogSave" class="btn primary" value="default">Save</button></div></form></dialog><input type="file" id="filePicker" accept=".csv,.xlsx,.xls" hidden><div id="toast" class="toast"></div><script src="config.js"></script><script src="offline-store.js"></script><script type="module" src="app.js"></script><script type="module" src="eorder-book.js"></script><script type="module" src="staff-portal.js"></script></body></html>
